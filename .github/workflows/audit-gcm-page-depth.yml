name: Audit GCM page depth
on:
  push:
    paths:
      - 'tools/audit_gcm_page_depth.py'
      - '.github/workflows/audit-gcm-page-depth.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit current GCM study pages
        run: python tools/audit_gcm_page_depth.py
