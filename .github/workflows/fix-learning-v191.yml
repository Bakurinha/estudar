name: Harden guided learning v1.9.1

on:
  push:
    paths:
      - 'tools/fix_learning_v191.py'
      - '.github/workflows/fix-learning-v191.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot disciplinary data
        run: |
          find data -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/data-before.sha256

      - name: Apply v1.9.1 learning fixes
        run: python tools/fix_learning_v191.py

      - name: Check JavaScript syntax
        run: |
          node --check js/services/learning.js
          node --check js/views/study.js
          node --check js/views/reviews.js
          node --check js/services/performance.js
          node --check js/router.js
          node --check js/app.js
          node --check sw.js

      - name: Validate stable page learning identifiers
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, re

          ROOT=Path('.')
          def load_gcm():
              return json.loads((ROOT/'data/lessons/gcm-salvador-2026.json').read_text(encoding='utf-8'))
          def load_pack(cid):
              parts=sorted((ROOT/'data/packages').glob(f'{cid}.part-*.b64'))
              enc=''.join(p.read_text(encoding='utf-8') for p in parts)
              raw=base64.b64decode(re.sub(r'\s+','',enc))
              return json.loads(gzip.decompress(raw).decode('utf-8'))['lessons']
          for cid, lessons in [
              ('gcm-salvador-2026',load_gcm()),
              ('paradigmas-python',load_pack('paradigmas-python')),
              ('matematica-logica',load_pack('matematica-logica')),
          ]:
              ids=[]
              for lesson in lessons:
                  topic=lesson.get('topicId') or lesson.get('id')
                  for i,page in enumerate(lesson.get('studyPages') or []):
                      rid=page.get('id') or f'{topic}-page-{i+1:03d}'
                      ids.append(rid)
              assert len(ids)==len(set(ids)), f'{cid}: page learning IDs are not unique'
              print(cid, 'stable-page-ids OK', len(ids))
          PY

      - name: Validate learning grounding across all pages
        run: python tools/validate_learning_method.py

      - name: Preserve existing project validations
        run: |
          python tools/validate_project.py
          python tools/validate_bank_v2.py

      - name: Assert disciplinary data unchanged
        run: |
          find data -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/data-after.sha256
          diff -u /tmp/data-before.sha256 /tmp/data-after.sha256
          echo 'DISCIPLINARY DATA UNCHANGED'

      - name: Commit validated v1.9.1
        run: |
          rm -f tools/fix_learning_v191.py
          rm -f .github/workflows/fix-learning-v191.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden guided retrieval and page learning progress'
          git push
