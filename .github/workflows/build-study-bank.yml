name: Build study bank

on:
  workflow_dispatch:
  push:
    branches: ['fix/security-october-2026']
    paths:
      - 'tools/generate_seed_data.py'
      - 'tools/expand_bank_v2.py'
      - 'tools/build_study_bank.py'
      - 'tools/deepen_lessons.py'
      - 'tools/normalize_lesson_depth.py'
      - 'tools/build_study_manual_v5.py'
      - 'tools/sanitize_bank.py'

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/fix/security-october-2026'
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Generate canonical seed data
        run: python tools/generate_seed_data.py

      - name: Expand lessons and question bank
        run: python tools/build_study_bank.py

      - name: Apply topic-specific deepening
        run: python tools/deepen_lessons.py

      - name: Build paginated study manual V5
        run: python tools/build_study_manual_v5.py

      - name: Normalize lesson depth after manual generation
        run: python tools/normalize_lesson_depth.py

      - name: Sanitize all question alternatives
        run: python tools/sanitize_bank.py

      - name: Validate original project invariants
        run: python tools/validate_project.py

      - name: Validate expanded bank
        run: python tools/validate_bank_v2.py

      - name: Block pedagogical regressions before commit
        run: |
          python tools/pedagogical_quality_gate.py --reference HEAD --report quality/reports/quality-gate-build.json
          python tools/pedagogical_preservation_gate.py --reference HEAD

      - name: Prepare reviewable patch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- data/
          git diff --binary HEAD -- data/ > "$RUNNER_TEMP/generated.patch"
          if [ -s "$RUNNER_TEMP/generated.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: study-bank-proposal
          path: ${{ runner.temp }}/generated.patch
          retention-days: 7
          if-no-files-found: error
