name: Build study bank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/generate_seed_data.py'
      - 'tools/expand_bank_v2.py'
      - 'tools/build_study_bank.py'
      - 'tools/deepen_lessons.py'
      - 'tools/normalize_lesson_depth.py'
      - 'tools/build_study_manual_v5.py'
      - 'tools/sanitize_bank.py'

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Generate canonical seed data
        run: python tools/generate_seed_data.py

      - name: Expand lessons and question bank
        run: python tools/build_study_bank.py

      - name: Apply topic-specific deepening
        run: python tools/deepen_lessons.py

      - name: Build paginated study manual V5
        run: python tools/build_study_manual_v5.py

      - name: Normalize lesson depth after manual generation
        run: python tools/normalize_lesson_depth.py

      - name: Sanitize all question alternatives
        run: python tools/sanitize_bank.py

      - name: Validate original project invariants
        run: python tools/validate_project.py

      - name: Validate expanded bank
        run: python tools/validate_bank_v2.py

      - name: Block pedagogical regressions before commit
        run: |
          python tools/pedagogical_quality_gate.py --reference HEAD --report quality/reports/quality-gate-build.json
          python tools/pedagogical_preservation_gate.py --reference HEAD

      - name: Prepare reviewable patch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- data/
          git diff --binary HEAD -- data/ > "$RUNNER_TEMP/generated.patch"
          if [ -s "$RUNNER_TEMP/generated.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: study-bank-proposal
          path: ${{ runner.temp }}/generated.patch
          retention-days: 7
          if-no-files-found: error

  propose:
    needs: build
    if: needs.build.outputs.changed == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: study-bank-proposal
          path: ${{ runner.temp }}/proposal
      # No package installation or repository script runs in this job.
      - name: Validate and commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git apply --index -- "$RUNNER_TEMP/proposal/generated.patch"
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, paths):
              if not (path.startswith('data/') and '/.' not in path and not path.endswith('/')):
                  raise SystemExit('Unexpected generated path; publication stopped')
          modes = subprocess.check_output(['git', 'diff', '--cached', '--raw']).decode().splitlines()
          if any(line.split()[1] not in ('100644', '000000') for line in modes):
              raise SystemExit('Unexpected generated file mode; publication stopped')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'data: rebuild expanded study bank'
      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/study-bank-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GH_REPO" --base 'main' --head "$branch" --draft \
            --title 'data: rebuild expanded study bank' \
            --body 'Generated in an isolated read-only job. Review the diff and approve the required CI runs before merging. No automatic merge or production deployment is performed by this workflow.'
