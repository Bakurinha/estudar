name: Pedagogical quality gate

on:
  pull_request:
    paths:
      - 'data/**'
      - 'quality/**'
      - 'tools/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - pedagogical-quality-v2
    paths:
      - 'data/**'
      - 'quality/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Bootstrap baseline and classification on quality branch
        if: github.ref_name == 'pedagogical-quality-v2' && github.actor != 'github-actions[bot]'
        run: python tools/build_pedagogical_baseline.py --write

      - name: Validate existing project invariants
        run: python tools/validate_project.py

      - name: Validate expanded bank
        run: python tools/validate_bank_v2.py

      - name: Validate learning-method grounding
        run: python tools/validate_learning_method.py

      - name: Run pedagogical quality gate
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            python tools/pedagogical_quality_gate.py --reference HEAD^ --report quality/reports/quality-gate-current.json
            python tools/pedagogical_preservation_gate.py --reference HEAD^
          else
            python tools/pedagogical_quality_gate.py --reference HEAD --report quality/reports/quality-gate-current.json
            python tools/pedagogical_preservation_gate.py --reference HEAD
          fi

  bootstrap:
    if: github.event_name == 'push' && github.ref == 'refs/heads/pedagogical-quality-v2' && github.actor != 'github-actions[bot]'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/build_pedagogical_baseline.py --write
      - name: Commit bootstrap quality artifacts
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- quality/reports/ data/quality/)" ]; then
            echo "Quality artifacts already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality/reports/ data/quality/
          git commit -m "quality: bootstrap pedagogical baseline and classification"
          git push
