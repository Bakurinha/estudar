name: Pedagogical quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - pedagogical-quality-v2
    paths:
      - 'data/**'
      - 'quality/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Bootstrap baseline and classification on quality branch
        if: github.ref_name == 'pedagogical-quality-v2' && github.actor != 'github-actions[bot]'
        run: python tools/build_pedagogical_baseline.py --write

      - name: Validate existing project invariants
        run: python tools/validate_project.py

      - name: Validate expanded bank
        run: python tools/validate_bank_v2.py

      - name: Validate learning-method grounding
        run: python tools/validate_learning_method.py

      - name: Run pedagogical quality gate
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            python tools/pedagogical_quality_gate.py --reference HEAD^ --report quality/reports/quality-gate-current.json
            python tools/pedagogical_preservation_gate.py --reference HEAD^
          else
            python tools/pedagogical_quality_gate.py --reference HEAD --report quality/reports/quality-gate-current.json
            python tools/pedagogical_preservation_gate.py --reference HEAD
          fi
      - name: Prepare reviewable patch
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- quality/reports/ data/quality/
          git diff --binary HEAD -- quality/reports/ data/quality/ > "$RUNNER_TEMP/generated.patch"
          if [ -s "$RUNNER_TEMP/generated.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload generated patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-baseline-proposal
          path: ${{ runner.temp }}/generated.patch
          retention-days: 7
          if-no-files-found: error

  propose:
    needs: quality
    if: needs.quality.outputs.changed == 'true' && github.ref == 'refs/heads/pedagogical-quality-v2' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quality-baseline-proposal
          path: ${{ runner.temp }}/proposal
      # No package installation or repository script runs in this job.
      - name: Validate and commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git apply --index -- "$RUNNER_TEMP/proposal/generated.patch"
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, paths):
              if not (path.startswith(('quality/reports/', 'data/quality/')) and '/.' not in path):
                  raise SystemExit('Unexpected generated path; publication stopped')
          modes = subprocess.check_output(['git', 'diff', '--cached', '--raw']).decode().splitlines()
          if any(line.split()[1] not in ('100644', '000000') for line in modes):
              raise SystemExit('Unexpected generated file mode; publication stopped')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'quality: bootstrap pedagogical baseline and classification'
      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/quality-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GH_REPO" --base 'pedagogical-quality-v2' --head "$branch" --draft \
            --title 'quality: bootstrap pedagogical baseline and classification' \
            --body 'Generated in an isolated read-only job. Review the diff and approve the required CI runs before merging. No automatic merge or production deployment is performed by this workflow.'
