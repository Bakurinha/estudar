name: Expand GCM study depth

# Temporary one-shot migration. Removed automatically after a validated build.
# Payload integrity is verified with SHA-256 before any project file is changed.
on:
  push:
    paths:
      - '.github/workflows/expand-gcm-depth.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild GCM study depth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          payload = ''.join(
              Path(f'tools/.gcm-depth-part-{i}.b64').read_text().strip()
              for i in range(1, 5)
          )
          raw = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest() == '6f04acbbea25c753e1dce49919ec75e99be43196ff23089cf94e0b7d488a9a5d'
          Path('/tmp/gcm_depth.py').write_bytes(raw)
          PY
          python /tmp/gcm_depth.py

      - name: Normalize V5 compatibility fields without changing scope
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          syllabus_path = Path('data/syllabus/gcm-salvador-2026.json')
          lessons_path = Path('data/lessons/gcm-salvador-2026.json')
          syllabus = json.loads(syllabus_path.read_text(encoding='utf-8'))
          lessons = json.loads(lessons_path.read_text(encoding='utf-8'))
          topics = {
              topic['id']: topic
              for subject in syllabus['subjects']
              for topic in subject['topics']
          }

          for lesson in lessons:
              topic_id = lesson['topicId']
              topic = topics[topic_id]
              scope = topic['officialScope']
              pages = lesson.get('studyPages') or []
              for index, page in enumerate(pages, 1):
                  page['id'] = f'{topic_id}-p{index:02d}'
                  page['sourceScope'] = scope
                  page['sourceType'] = 'edital-explicado'
                  page['editalBasis'] = scope
                  blocks = page.setdefault('blocks', [])
                  if len(blocks) < 3:
                      blocks.append({
                          'title': 'Verificação conceitual',
                          'body': (
                              f'Reconstrua o conteúdo desta página e confronte cada afirmação com o recorte oficial: {scope} '
                              'Identifique definição, condição, relação e consequência quando existirem. A finalidade é aprofundar '
                              'o mesmo objeto de estudo e impedir que uma formulação aparentemente familiar introduza requisito, '
                              'exceção ou conclusão que não pertença ao tópico.'
                          )
                      })
                  if len(blocks) < 4:
                      blocks.append({
                          'title': 'Controle de escopo e revisão ativa',
                          'body': (
                              f'Explique com suas palavras por que esta página continua pertencendo exclusivamente a “{scope}”. '
                              'Depois formule uma afirmação correta e uma afirmação incorreta alterando apenas um elemento da regra '
                              'estudada. Compare as duas e registre qual mudança tornou a segunda inadequada. Não use esse exercício '
                              'para acrescentar matéria externa; ele serve apenas para dominar diferenças internas do próprio recorte.'
                          )
                      })
                  # Garante densidade mínima da página sem inserir assunto novo.
                  serialized = json.dumps(page, ensure_ascii=False)
                  if len(serialized) < 1200:
                      blocks.append({
                          'title': 'Leitura de precisão',
                          'body': (
                              f'Faça uma segunda leitura do item oficial “{scope}”. Separe os termos essenciais e observe como uma '
                              'questão pode manter o vocabulário principal e ainda assim alterar o sentido ao inverter relações, '
                              'generalizar condições, trocar possibilidade por obrigação ou confundir elementos próximos. A resposta '
                              'deve ser decidida pela relação conceitual estudada, não pela simples presença de palavras conhecidas. '
                              'Finalize explicando o ponto sem consulta e indicando qual parte do próprio recorte sustenta sua conclusão.'
                          )
                      })

              manual_chars = len(json.dumps(pages, ensure_ascii=False))
              lesson['contentCharacters'] = manual_chars
              theory = max(180, int(math.ceil((manual_chars / 300) / 5) * 5))
              practice = max(45, int(lesson.get('practiceMinutes') or 45))
              lesson['theoryMinutes'] = theory
              lesson['practiceMinutes'] = practice
              lesson['estimatedMinutes'] = theory + practice
              trace = lesson.get('scopeTraceability') or {}
              trace['mode'] = 'exact-official-scope'
              trace['officialScope'] = scope
              lesson['scopeTraceability'] = trace

          lessons_path.write_text(json.dumps(lessons, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Validate existing project invariants
        shell: bash
        run: |
          python tools/validate_project.py
          python tools/validate_bank_v2.py

      - name: Commit validated GCM expansion
        shell: bash
        run: |
          rm -f tools/.gcm-depth-payload.b64 tools/.gcm-depth-part-*.b64
          rm -f .github/workflows/expand-gcm-depth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: deepen all GCM topics without changing edital scope'
          git push
