name: Expand academic subtopic depth

on:
  push:
    paths:
      - 'tools/.academic-depth-part-1.b64'
      - 'tools/.academic-depth-part-2.b64'
      - '.github/workflows/expand-academic-depth.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild academic study packages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = (
              Path('tools/.academic-depth-part-1.b64').read_text().strip()
              + Path('tools/.academic-depth-part-2.b64').read_text().strip()
          )
          Path('/tmp/expand_academic_depth.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/expand_academic_depth.py

      - name: Commit validated expansion
        shell: bash
        run: |
          rm -f tools/.academic-depth-part-1.b64 tools/.academic-depth-part-2.b64
          rm -f .github/workflows/expand-academic-depth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: deepen every academic subtopic without changing scope'
            git push
          fi
