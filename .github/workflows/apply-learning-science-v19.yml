name: Apply learning-science v1.9

on:
  push:
    paths:
      - 'tools/apply_learning_science_v19.py'
      - 'tools/patch_learning_practice.py'
      - '.github/workflows/apply-learning-science-v19.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot disciplinary data
        run: |
          find data -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/data-before.sha256

      - name: Apply methodology migration
        run: |
          python tools/apply_learning_science_v19.py
          python tools/patch_learning_practice.py

      - name: Check JavaScript syntax
        run: |
          node --check js/services/learning.js
          node --check js/views/study.js
          node --check js/views/reviews.js
          node --check js/services/performance.js
          node --check js/router.js
          node --check js/app.js
          node --check sw.js

      - name: Validate all study pages can ground retrieval
        run: python tools/validate_learning_method.py

      - name: Preserve project and GCM question-bank validation
        run: |
          python tools/validate_project.py
          python tools/validate_bank_v2.py

      - name: Assert disciplinary data unchanged
        run: |
          find data -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/data-after.sha256
          diff -u /tmp/data-before.sha256 /tmp/data-after.sha256
          echo 'DISCIPLINARY DATA UNCHANGED'

      - name: Commit validated methodology
        run: |
          rm -f tools/apply_learning_science_v19.py
          rm -f tools/patch_learning_practice.py
          rm -f .github/workflows/apply-learning-science-v19.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: apply evidence-based learning flow across all study areas'
          git push
