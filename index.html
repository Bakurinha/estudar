<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Plataforma leve de estudos para concursos, com edital, questões, revisão, simulados e TAF.">
  <title>Rumo à Aprovação</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo principal</a>

  <div id="app" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Navegação principal" aria-hidden="false">
      <div class="sidebar__header">
        <button
          id="sidebar-collapse"
          class="icon-button sidebar__collapse"
          type="button"
          aria-label="Recolher menu lateral"
          title="Recolher menu"
        >
          ☰
        </button>

        <div class="brand">
          <strong class="brand__title">Rumo à Aprovação</strong>
          <span class="brand__subtitle">Plataforma de concursos</span>
        </div>

        <button
          id="mobile-menu-close"
          class="icon-button sidebar__mobile-close"
          type="button"
          aria-label="Fechar menu"
          title="Fechar menu"
        >
          ×
        </button>
      </div>

      <nav class="nav-list" aria-label="Seções do aplicativo">
        <span class="nav-list__label">Principal</span>
        <a href="#/dashboard" data-route-link="dashboard"><span class="nav-icon" aria-hidden="true">⌂</span><span>Hoje</span></a>
        <a href="#/study" data-route-link="study"><span class="nav-icon" aria-hidden="true">☷</span><span>Estudar</span></a>
        <a href="#/questions" data-route-link="questions"><span class="nav-icon" aria-hidden="true">?</span><span>Exercícios</span></a>
        <a href="#/reviews" data-route-link="reviews"><span class="nav-icon" aria-hidden="true">↻</span><span>Revisões</span></a>

        <span class="nav-list__label">Avaliação</span>
        <a href="#/simulator" data-route-link="simulator"><span class="nav-icon" aria-hidden="true">▣</span><span>Simulados</span></a>
        <a href="#/performance" data-route-link="performance"><span class="nav-icon" aria-hidden="true">▥</span><span>Desempenho</span></a>
        <a href="#/history" data-route-link="history"><span class="nav-icon" aria-hidden="true">≡</span><span>Histórico</span></a>

        <span class="nav-list__label">Planejamento</span>
        <a href="#/schedule" data-route-link="schedule"><span class="nav-icon" aria-hidden="true">□</span><span>Agenda</span></a>
        <a href="#/taf" data-route-link="taf"><span class="nav-icon" aria-hidden="true">⚑</span><span>TAF</span></a>

        <span class="nav-list__label">Sistema</span>
        <a href="#/import" data-route-link="import"><span class="nav-icon" aria-hidden="true">⇧</span><span>Novo edital</span></a>
        <a href="#/settings" data-route-link="settings"><span class="nav-icon" aria-hidden="true">⚙</span><span>Configurações</span></a>
      </nav>

      <div class="sidebar__footer">
        <div class="sidebar__status">
          <span id="connection-dot" class="status-dot" aria-hidden="true"></span>
          <span id="connection-status">Online</span>
        </div>
        <span id="app-version" class="muted">v1.1.0</span>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <section class="app-main">
      <header class="topbar">
        <button
          id="mobile-menu"
          class="icon-button topbar__menu"
          type="button"
          aria-label="Abrir menu"
          title="Abrir menu"
        >
          ☰
        </button>

        <div class="topbar__contest">
          <label class="visually-hidden" for="contest-selector">Concurso ativo</label>
          <select id="contest-selector" class="select-compact" aria-label="Concurso ativo"></select>
        </div>

        <div class="topbar__actions">
          <button id="install-app" class="button button--ghost topbar__install" type="button" hidden>
            Instalar
          </button>
          <button id="quick-timer" class="button button--ghost quick-timer" type="button" title="Iniciar sessão de estudo">
            <span aria-hidden="true">⏱</span><span class="quick-timer__label">50 min</span>
          </button>
        </div>
      </header>

      <main id="main-content" class="main-content" tabindex="-1">
        <noscript>
          <div class="notice notice--danger">Este aplicativo precisa de JavaScript para funcionar.</div>
        </noscript>
        <div id="route-view" aria-live="polite"></div>
      </main>
    </section>
  </div>

  <!--
    Navegação rápida para telas pequenas.
    O menu lateral continua sendo a navegação completa; esta barra existe somente
    para reduzir toques nas quatro áreas mais usadas no celular.
  -->
  <nav class="mobile-dock" aria-label="Navegação rápida no celular">
    <a href="#/dashboard" data-route-link="dashboard"><span aria-hidden="true">⌂</span><small>Hoje</small></a>
    <a href="#/study" data-route-link="study"><span aria-hidden="true">☷</span><small>Estudar</small></a>
    <a href="#/questions" data-route-link="questions"><span aria-hidden="true">?</span><small>Exercícios</small></a>
    <a href="#/reviews" data-route-link="reviews"><span aria-hidden="true">↻</span><small>Revisar</small></a>
    <button id="mobile-menu-bottom" type="button" aria-label="Abrir menu completo"><span aria-hidden="true">☰</span><small>Menu</small></button>
  </nav>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog id="global-dialog" class="dialog"></dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
